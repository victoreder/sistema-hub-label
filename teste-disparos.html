<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Disparos - Disparamator</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://hxumiciyohbianfnzfyk.supabase.co/storage/v1/object/public/arquivos/FAVICON.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .header h1 {
            font-size: 2rem;
            background: #25d366;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .user-info h2 {
            color: #25d366;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .user-info-item {
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .user-info-item strong {
            color: #25d366;
            margin-right: 10px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #25d366;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(255, 68, 68, 0.3);
        }

        .table-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            color: #25d366;
            font-weight: 600;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-ativo {
            background: rgba(37, 211, 102, 0.2);
            color: #25d366;
        }

        .status-pausado {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .status-finalizado {
            background: rgba(107, 114, 128, 0.2);
            color: #9ca3af;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff3b30;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .realtime-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #25d366;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .realtime-indicator.disconnected {
            background: #ff4444;
            animation: none;
        }

        /* === Dropdowns <select>: fundo branco e texto preto (light e dark) === */
        body.light-mode select,
        body.dark-mode select,
        body:not(.light-mode) select {
            background-color: #ffffff !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
        }
        body.light-mode select option,
        body.dark-mode select option,
        body:not(.light-mode) select option,
        body.light-mode select optgroup,
        body.dark-mode select optgroup,
        body:not(.light-mode) select optgroup {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
        body.light-mode select[class],
        body.dark-mode select[class],
        body:not(.light-mode) select[class] {
            background-color: #ffffff !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
        }
        body.light-mode select[class] option,
        body.dark-mode select[class] option,
        body:not(.light-mode) select[class] option {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
    </style>
    <link rel="stylesheet" href="dropdowns-global.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Teste de Disparos</h1>
            <button class="btn btn-danger" id="logoutBtn">Sair</button>
        </div>

        <div id="errorContainer"></div>

        <div class="user-info" id="userInfo">
            <div class="loading">Carregando informações do usuário...</div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="refreshBtn">
                Atualizar
                <span id="realtimeIndicator" class="realtime-indicator disconnected"></span>
            </button>
            <button class="btn btn-primary" id="testUpdateBtn">
                Testar UPDATE (marcar lida)
            </button>
        </div>

        <div class="table-container">
            <div id="tableContent">
                <div class="loading">Carregando disparos...</div>
            </div>
        </div>
    </div>

    <script type="module">
        // Importar Supabase via CDN ESM
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm';
        
        // Configuração do Supabase
        const SUPABASE_URL = 'https://hxumiciyohbianfnzfyk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4dW1pY2l5b2hiaWFuZm56ZnlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzcwNjM1MDQsImV4cCI6MjA1MjYzOTUwNH0.6G3OIuVYtgKWqylUn7yzUblIzABvKj4euYBo-aPt5lQ';
        
        /**
         * Inicializa o cliente Supabase global (window.supabaseClient)
         * Esta função deve ser chamada uma vez no carregamento da pagina
         */
        function initSupabase() {
            if (window.supabaseClient) {
                console.log('✅ Supabase ja inicializado, reutilizando cliente existente');
                return window.supabaseClient;
            }
            
            console.log('🔧 Inicializando Supabase Client...');
            window.supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true,
                    storage: window.localStorage
                }
            });
            
            console.log('✅ Supabase Client inicializado e salvo em window.supabaseClient');
            return window.supabaseClient;
        }
        
        // Inicializar Supabase imediatamente
        const supabase = initSupabase();

        // Elementos do DOM
        const userInfoDiv = document.getElementById('userInfo');
        const tableContent = document.getElementById('tableContent');
        const errorContainer = document.getElementById('errorContainer');
        const refreshBtn = document.getElementById('refreshBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const realtimeIndicator = document.getElementById('realtimeIndicator');

        let realtimeSubscription = null;

        // Verificar sessão ao carregar
        async function checkSession() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) {
                    console.error('Erro ao verificar sessão:', error);
                    showError('Erro ao verificar sessão. Redirecionando para login...');
                    setTimeout(() => {
                        window.location.href = 'login-copia.html';
                    }, 2000);
                    return false;
                }
                
                if (!session) {
                    console.log('Nenhuma sessão encontrada. Redirecionando para login...');
                    window.location.href = 'login-copia.html';
                    return false;
                }
                
                console.log('Sessão válida encontrada:', session.user.email);
                return true;
            } catch (error) {
                console.error('Erro ao verificar sessão:', error);
                showError('Erro ao verificar sessão. Redirecionando para login...');
                setTimeout(() => {
                    window.location.href = 'login-copia.html';
                }, 2000);
                return false;
            }
        }

        // Mostrar informacoes do usuário do Supabase Auth
        async function loadUserProfile() {
            try {
                const { data: { user }, error: userError } = await supabase.auth.getUser();
                
                if (userError || !user) {
                    throw new Error('Usuário nao encontrado');
                }

                // Renderizar informacoes do usuário do Supabase Auth
                userInfoDiv.innerHTML = `
                    <h2>Informacoes do Usuário</h2>
                    <div class="user-info-item">
                        <strong>ID (Supabase Auth):</strong> ${user.id}
                    </div>
                    <div class="user-info-item">
                        <strong>Email:</strong> ${user.email || 'N/A'}
                    </div>
                    <div class="user-info-item">
                        <strong>Último Login:</strong> ${user.last_sign_in_at ? new Date(user.last_sign_in_at).toLocaleString('pt-BR') : 'N/A'}
                    </div>
                `;

                return user.id;
            } catch (error) {
                console.error('Erro ao carregar perfil:', error);
                userInfoDiv.innerHTML = `
                    <div class="error-message">
                        Erro ao carregar perfil: ${error.message}
                    </div>
                `;
                throw error;
            }
        }

        // Buscar disparos
        async function loadDisparos() {
            try {
                tableContent.innerHTML = '<div class="loading">Carregando disparos...</div>';

                // Guard: Verificar sessão antes de SELECT
                const { data: { session } } = await supabase.auth.getSession();
                if (!session || !session.access_token) {
                    console.error('❌ Sem sessão/JWT - faça login novamente');
                    tableContent.innerHTML = '<div class="error-message">❌ Sem sessão/JWT - faça login novamente</div>';
                    return;
                }
                
                console.log('Buscando disparos da tabela SAAS_Disparos...');
                
                // Buscar disparos - RLS deve filtrar automaticamente por userId
                const { data, error } = await supabase
                    .from('SAAS_Disparos')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) {
                    console.error('Erro ao buscar disparos:', error);
                    throw error;
                }

                console.log('Disparos encontrados:', data?.length || 0, data);

                if (!data || data.length === 0) {
                    tableContent.innerHTML = '<div class="loading">Nenhum disparo encontrado.</div>';
                    return;
                }

                // Renderizar tabela com todas as colunas disponíveis
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Data/Hora</th>
                                <th>Status</th>
                                <th>Tipo</th>
                                <th>Total</th>
                                <th>Disparadas</th>
                                <th>User ID</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach(disparo => {
                    const statusClass = disparo.StatusDisparo === 'ativo' || disparo.StatusDisparo === 'Aguardando' ? 'status-ativo' : 
                                       disparo.StatusDisparo === 'pausado' ? 'status-pausado' : 
                                       'status-finalizado';
                    
                    tableHTML += `
                        <tr>
                            <td>${disparo.id || 'N/A'}</td>
                            <td>${disparo.created_at ? new Date(disparo.created_at).toLocaleString('pt-BR') : 'N/A'}</td>
                            <td><span class="status ${statusClass}">${disparo.StatusDisparo || 'N/A'}</span></td>
                            <td>${disparo.TipoDisparo || 'N/A'}</td>
                            <td>${disparo.TotalDisparos || 0}</td>
                            <td>${disparo.MensagensDisparadas || 0}</td>
                            <td>${disparo.userId || 'N/A'}</td>
                        </tr>
                    `;
                });

                tableHTML += `
                        </tbody>
                    </table>
                `;

                tableContent.innerHTML = tableHTML;
                console.log('Tabela de disparos renderizada com sucesso');
            } catch (error) {
                console.error('Erro ao carregar disparos:', error);
                tableContent.innerHTML = `
                    <div class="error-message">
                        <strong>Erro ao carregar disparos:</strong><br>
                        ${error.message || 'Erro desconhecido'}<br>
                        <small>Verifique o console para mais detalhes</small>
                    </div>
                `;
            }
        }

        // Configurar Realtime
        function setupRealtime() {
            // Remover subscription anterior se existir
            if (realtimeSubscription) {
                supabase.removeChannel(realtimeSubscription);
                realtimeSubscription = null;
            }

            realtimeSubscription = supabase
                .channel('disparos-changes')
                .on(
                    'postgres_changes',
                    {
                        event: '*',
                        schema: 'public',
                        table: 'SAAS_Disparos'
                    },
                    (payload) => {
                        console.log('Mudança detectada no Realtime:', payload);
                        realtimeIndicator.classList.remove('disconnected');
                        
                        // Recarregar disparos quando houver mudança
                        loadDisparos();
                    }
                )
                .subscribe((status) => {
                    console.log('Status da subscription Realtime:', status);
                    if (status === 'SUBSCRIBED') {
                        realtimeIndicator.classList.remove('disconnected');
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        realtimeIndicator.classList.add('disconnected');
                        // Tentar reconectar após um delay
                        setTimeout(() => {
                            setupRealtime();
                        }, 3000);
                    } else {
                        realtimeIndicator.classList.add('disconnected');
                    }
                });
        }

        // Configurar listeners para eventos de auth (TOKEN_REFRESHED, SIGNED_IN)
        function setupAuthListeners() {
            supabase.auth.onAuthStateChange((event, session) => {
                console.log('Auth state changed:', event, session);
                
                if (event === 'TOKEN_REFRESHED' || event === 'SIGNED_IN') {
                    console.log('Token atualizado ou usuário logado, reconfigurando Realtime...');
                    // Reconfigurar Realtime após token refresh ou sign in
                    setupRealtime();
                } else if (event === 'SIGNED_OUT') {
                    console.log('Usuário deslogado');
                    // Remover subscription ao fazer logout
                    if (realtimeSubscription) {
                        supabase.removeChannel(realtimeSubscription);
                        realtimeSubscription = null;
                    }
                }
            });
        }

        // Função para mostrar erro
        function showError(message) {
            errorContainer.innerHTML = `
                <div class="error-message">${message}</div>
            `;
        }

        function showPopupMessage(message, titulo = 'Aviso') {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100000;padding:16px;';
                const box = document.createElement('div');
                box.style.cssText = 'width:100%;max-width:460px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 45px rgba(2,6,23,.3);';
                box.innerHTML = `
                    <h3 style="margin:0 0 10px 0;font-size:18px;font-weight:700;color:#0f172a;">${String(titulo || 'Aviso').replace(/</g, '&lt;')}</h3>
                    <p style="margin:0 0 16px 0;font-size:14px;line-height:1.6;color:#334155;">${String(message || '').replace(/</g, '&lt;').replace(/\n/g, '<br>')}</p>
                    <div style="display:flex;justify-content:flex-end;">
                        <button type="button" data-ok style="border:0;background:#2563eb;color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;">OK</button>
                    </div>
                `;
                overlay.appendChild(box);
                document.body.appendChild(overlay);
                const close = () => {
                    overlay.remove();
                    resolve();
                };
                overlay.addEventListener('click', (event) => {
                    if (event.target === overlay) close();
                });
                box.querySelector('[data-ok]').addEventListener('click', close);
            });
        }

        // Botao de atualizar
        refreshBtn.addEventListener('click', async () => {
            await loadDisparos();
        });
        
        // Botao de teste UPDATE
        const testUpdateBtn = document.getElementById('testUpdateBtn');
        testUpdateBtn.addEventListener('click', async () => {
            try {
                // Guard: Verificar sessão antes de UPDATE
                const { data: { session } } = await supabase.auth.getSession();
                if (!session || !session.access_token) {
                    await showPopupMessage('Sem sessão/JWT - faça login novamente', 'Erro');
                    return;
                }
                
                // Log de debug
                const { data: u } = await supabase.auth.getUser();
                console.log('auth.uid', u?.user?.id);
                
                // Testar UPDATE em uma conversa (ID 83 conforme exemplo)
                const conversaId = 83;
                console.log(`Testando UPDATE na conversa ${conversaId}...`);
                
                const { data: updateData, error: updateError } = await supabase
                    .from('SAAS_Conversas_Agentes')
                    .update({ lida: true })
                    .eq('id', conversaId)
                    .select();
                
                if (updateError) {
                    console.error('❌ Erro no UPDATE:', updateError);
                    await showPopupMessage(`Erro no UPDATE: ${updateError.message}`, 'Erro');
                } else {
                    console.log('✅ UPDATE realizado com sucesso:', updateData);
                    await showPopupMessage(`UPDATE realizado com sucesso! Linhas afetadas: ${updateData?.length || 0}`, 'Sucesso');
                }
            } catch (error) {
                console.error('❌ Erro ao testar UPDATE:', error);
                await showPopupMessage(`Erro: ${error.message}`, 'Erro');
            }
        });

        // Botao de logout
        logoutBtn.addEventListener('click', async () => {
            try {
                // Remover subscription
                if (realtimeSubscription) {
                    supabase.removeChannel(realtimeSubscription);
                }

                const { error } = await supabase.auth.signOut();
                
                if (error) {
                    throw error;
                }
                
                window.location.href = 'login-copia.html';
            } catch (error) {
                console.error('Erro ao fazer logout:', error);
                showError('Erro ao fazer logout. Redirecionando...');
                setTimeout(() => {
                    window.location.href = 'login-copia.html';
                }, 2000);
            }
        });

        // Inicializar pagina
        async function init() {
            const hasSession = await checkSession();
            
            if (!hasSession) {
                return;
            }

            try {
                // Log de debug: auth.uid
                const { data: u } = await supabase.auth.getUser();
                console.log('auth.uid', u?.user?.id);
                
                await loadUserProfile();
                await loadDisparos();
                setupRealtime();
                setupAuthListeners();
            } catch (error) {
                console.error('Erro na inicialização:', error);
                showError(`Erro na inicialização: ${error.message}`);
            }
        }

        // Iniciar quando a pagina carregar
        init();
    </script>
</body>
</html>
